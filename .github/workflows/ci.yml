name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: swu-glass-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: swu-glass-prototype/package-lock.json
      - run: npm ci
      - run: npm run test:data
      - run: npm run build
      - run: npm run test:sites

  backend:
    runs-on: ubuntu-latest
    env:
      SWU_NETWORK_MODE: direct
    defaults:
      run:
        working-directory: swu-notice-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
